# `name` value will appear "as is" in the badge.
# See https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#adding-a-workflow-status-badge-to-your-repository
# yamllint --format github .github/workflows/release.yaml
---
name: "release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the release. Ex v1.34.1 or v1.34.1_debug
        required: true

defaults:
  run: # use bash for all operating systems unless overridden
    shell: bash

jobs:
  resolve:
    name: "resolve"
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      compilation_mode: ${{ steps.resolve.outputs.compilation_mode }}
    steps:
      - name: "Resolve release inputs"
        id: resolve
        run: |
          version="${{ github.event.inputs.version }}"
          echo "ref=${version%_debug}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *_debug ]]; then
            echo "compilation_mode=dbg" >> "$GITHUB_OUTPUT"
          else
            echo "compilation_mode=opt" >> "$GITHUB_OUTPUT"
          fi

  build-envoy-macos:
    name: "build envoy (macos)"
    needs: resolve
    uses: ./.github/workflows/build-macos.yaml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      compilation_mode: ${{ needs.resolve.outputs.compilation_mode }}
      artifact_name: envoy-${{ github.event.inputs.version }}-darwin-arm64
    secrets: inherit

  archive-linux:
    name: "archive (linux)"
    uses: ./.github/workflows/archive-release.yaml
    with:
      version: ${{ github.event.inputs.version }}
      os: linux
    secrets: inherit

  archive-macos:
    name: "archive (macos)"
    needs: build-envoy-macos
    uses: ./.github/workflows/archive-release.yaml
    with:
      version: ${{ github.event.inputs.version }}
      os: darwin
    secrets: inherit

  notify-patch-service:
    name: "notify patch-service"
    if: ${{ !endsWith(github.event.inputs.version, '_debug') }}
    needs:
      - resolve
      - archive-linux
      - archive-macos
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PATCH_SERVICE_TOKEN: ${{ secrets.TETRATE_PATCH_SERVICE_TOKEN }}
      VERSION_TAG: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: "Report OSS Envoy release"
        run: ./bin/notify_patch_service.sh "${VERSION_TAG}"

  # Smoke tests run after publishing so uploads are not blocked by test failures.
  test-linux:
    name: "test (linux ${{ matrix.arch }})"
    needs: archive-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-envoy
        with:
          version: ${{ github.event.inputs.version }}

  test-macos:
    name: "test (macos)"
    needs: archive-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-envoy
        with:
          version: ${{ github.event.inputs.version }}
