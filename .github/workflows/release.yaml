# `name` value will appear "as is" in the badge.
# See https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#adding-a-workflow-status-badge-to-your-repository
# yamllint --format github .github/workflows/release.yaml
---
name: "release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the release. Ex v1.34.1 or v1.34.1_debug
        required: true

defaults:
  run: # use bash for all operating systems unless overridden
    shell: bash

jobs:
  build-envoy-macos:
    runs-on: macos-15-xlarge
    name: "build envoy (macos)"
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Resolve release inputs
        id: release
        run: |
          version="${{ github.event.inputs.version }}"
          source_version="${version%_debug}"
          compilation_mode=opt
          if [[ "${version}" == *_debug ]]; then
            compilation_mode=dbg
          fi

          {
            echo "source_version=${source_version}"
            echo "compilation_mode=${compilation_mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out Envoy source for the specified tag
        uses: actions/checkout@v4
        with:
          repository: envoyproxy/envoy
          ref: ${{ steps.release.outputs.source_version }}
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@0.18.0

      - name: Build envoy-static
        run: |
          export MACOSX_DEPLOYMENT_TARGET=14.5
          compilation_mode="${{ steps.release.outputs.compilation_mode }}"

          XCODE_DEFAULT_VERSION=16.1
          XCODE_VERSION="${XCODE_VERSION:-${XCODE_DEFAULT_VERSION}}"
          if [[ -n "$XCODE_VERSION" ]]; then
            sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
          fi

          # base Bazel flags from the Homebrew formula
          ARGS=(
            "--compilation_mode=${compilation_mode}"
            --curses=no
            --verbose_failures
            --define=wasm=enabled
            "--macos_minimum_os=${MACOSX_DEPLOYMENT_TARGET}"
            # TODO: Move this into Envoy's Apple linkopts; Rust DNS needs SystemConfiguration.
            "--linkopt=-Wl,-framework,SystemConfiguration"
          )

          # build the static binary
          bazel build "${ARGS[@]}" //source/exe:envoy-static

          # rename it
          mkdir -p bin
          mv bazel-bin/source/exe/envoy-static bin/envoy
          chmod +x bin/envoy

      - name: Publish attestation to GitHub
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bin/envoy

      - name: Upload Envoy binary
        uses: actions/upload-artifact@v4
        with:
          name: envoy-${{ github.event.inputs.version }}-darwin-arm64
          path: bin/envoy

  archive-linux:
    name: "archive (linux)"
    uses: ./.github/workflows/archive-release.yaml
    with:
      version: ${{ github.event.inputs.version }}
      include_macos: false
    secrets: inherit

  archive-macos:
    name: "archive (macos)"
    needs: build-envoy-macos
    uses: ./.github/workflows/archive-release.yaml
    with:
      version: ${{ github.event.inputs.version }}
      include_macos: true
    secrets: inherit

  # Smoke tests run after publishing so uploads are not blocked by test failures.
  test-linux:
    name: "test (linux)"
    needs: archive-linux
    runs-on: ubuntu-24.04

    steps:
      - name: "Extract `envoy` binary from GitHub release assets"
        run:
          | # https://docs.github.com/en/actions/learn-github-actions/environment-variables
          gh release -R "${GITHUB_REPOSITORY}" download "${{ github.event.inputs.version }}" -p "*-linux-amd64.tar.xz"
          tar --strip-components=2 -xpJf ./*.tar.xz && rm ./*.tar.xz
        env: # authenticate release downloads in case it is a draft (not public)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: ./envoy --version

  test-macos:
    name: "test (macos)"
    needs: archive-macos
    runs-on: macos-latest

    steps:
      - name: "Extract `envoy` binary from GitHub release assets"
        run:
          | # https://docs.github.com/en/actions/learn-github-actions/environment-variables
          gh release -R "${GITHUB_REPOSITORY}" download "${{ github.event.inputs.version }}" -p "*-darwin-arm64.tar.xz"
          tar --strip-components=2 -xpJf ./*.tar.xz && rm ./*.tar.xz
        env: # authenticate release downloads in case it is a draft (not public)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: ./envoy --version
