# yamllint --format github .github/workflows/nightly.yaml
---
name: "nightly"

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (dev or dev_debug)'
        type: choice
        options:
          - dev
          - dev_debug
        default: dev

concurrency:
  group: nightly-${{ inputs.version || 'trigger' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  trigger:
    name: "trigger"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: |
          gh workflow run nightly.yaml -f version=dev
          gh workflow run nightly.yaml -f version=dev_debug
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  resolve:
    name: "resolve"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      compilation_mode: ${{ steps.resolve.outputs.compilation_mode }}
    steps:
      - uses: actions/checkout@v4

      - name: "Resolve inputs"
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref=$(./bin/resolve_envoy_sha.sh)
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

          version="${{ inputs.version }}"
          if [[ "${version}" == *_debug ]]; then
            echo "compilation_mode=dbg" >> "$GITHUB_OUTPUT"
          else
            echo "compilation_mode=opt" >> "$GITHUB_OUTPUT"
          fi

  build-envoy-macos:
    name: "build envoy (macos)"
    needs: resolve
    uses: ./.github/workflows/build-macos.yaml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      compilation_mode: ${{ needs.resolve.outputs.compilation_mode }}
      artifact_name: envoy-${{ inputs.version }}-darwin-arm64
    secrets: inherit

  archive-linux:
    name: "archive (linux)"
    needs: resolve
    uses: ./.github/workflows/archive-release.yaml
    with:
      version: ${{ inputs.version }}
      os: linux
      envoy_sha: ${{ needs.resolve.outputs.ref }}
      prerelease: true
    secrets: inherit

  archive-macos:
    name: "archive (macos)"
    needs: [resolve, build-envoy-macos]
    uses: ./.github/workflows/archive-release.yaml
    with:
      version: ${{ inputs.version }}
      os: darwin
      envoy_sha: ${{ needs.resolve.outputs.ref }}
      prerelease: true
    secrets: inherit

  test-linux:
    name: "test (linux ${{ matrix.arch }})"
    needs: archive-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-envoy
        with:
          version: ${{ inputs.version }}

  test-macos:
    name: "test (macos)"
    needs: archive-macos
    runs-on: macos-15-xlarge
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-envoy
        with:
          version: ${{ inputs.version }}
