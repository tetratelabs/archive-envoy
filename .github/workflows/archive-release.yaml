# yamllint --format github .github/workflows/archive-release.yaml
---
name: "archive-release"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      version:
        description: "Release version tag"
        type: string
        required: true
      os:
        description: "OS to archive (linux or darwin)"
        type: string
        required: true
      envoy_sha:
        description: "Envoy commit SHA for dev builds"
        type: string
        default: ""
      prerelease:
        description: "Mark as prerelease and overwrite existing"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: "publish"
    # Hard-coding an LTS means maintenance,
    # but only once each 2 years!
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Use the existing cross-repository token for both gh and direct GitHub API requests.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      VERSION: ${{ inputs.version }}
      ENVOY_SHA: ${{ inputs.envoy_sha }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install Go"
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: "Download macOS Apple Silicon binary"
        if: inputs.os == 'darwin'
        uses: actions/download-artifact@v8
        with:
          name: "envoy-${{ inputs.version }}-\
            darwin-arm64"
          path: "${{ inputs.version }}/envoy-\
            ${{ inputs.version }}-darwin-arm64/bin"

      - name: "Mark macOS binary as executable"
        if: inputs.os == 'darwin'
        run: >-
          chmod +x
          "${VERSION}"/envoy-"${VERSION}"-darwin-arm64/bin/envoy

      - name: "Archive Envoy Release"
        id: archive
        env:
          ARCHIVE_OS: ${{ inputs.os }}
        run: |
          body=$(./bin/archive_release_version.sh envoyproxy/envoy "${VERSION}")
          {
            echo "body<<EOF"
            echo "${body}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Upload tarballs for testing"
        uses: actions/upload-artifact@v7
        with:
          name: "tarballs-${{ inputs.version }}-${{ inputs.os }}"
          path: "${{ inputs.version }}/*.tar.xz"

      - name: "Upload GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ inputs.version }}/*
          body: ${{ steps.archive.outputs.body }}

      - name: "Trigger Netlify deploy"
        if: >-
          ${{ env.NETLIFY_AUTH_TOKEN != ''
          && env.NETLIFY_SITE_ID != '' }}
        run: >-
          curl -s -X POST
          "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds"
          -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"
